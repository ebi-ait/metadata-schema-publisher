service: ${self:custom.metadata-schema-publisher.name}

frameworkVersion: ">=3.34.0 <4.0.0"

plugins:
  - serverless-finch
  - serverless-python-requirements
custom:
  metadata-schema-publisher: ${file(metadata-schema-publisher.yml)}
  client:
    bucketName: ${self:custom.metadata-schema-publisher.dev-bucket-name}
    distributionFolder: client

provider:
  name: aws
  region: us-east-1
  stage: ${self:custom.metadata-schema-publisher.stage}
  timeout: 300
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:ListBucket
      Resource: "arn:aws:s3:::${self:custom.metadata-schema-publisher.prod-bucket-name}"
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource: "arn:aws:s3:::${self:custom.metadata-schema-publisher.prod-bucket-name}/*"
    - Effect: Allow
      Action:
        - s3:ListBucket
      Resource: "arn:aws:s3:::${self:custom.metadata-schema-publisher.dev-bucket-name}"
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource: "arn:aws:s3:::${self:custom.metadata-schema-publisher.dev-bucket-name}/*"
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource: "arn:aws:secretsmanager:*:*:secret:${self:custom.metadata-schema-publisher.secret-name}-??????"

functions:
  onGithubPush:
    runtime: python3.10
    handler: handler.on_github_push
    environment:
      PROJECT_IDENTIFIER_CONFIG: ${self:custom.metadata-schema-publisher.project}
      # BRANCH_REFS_CONFIG and UNVERSIONED_FILES_CONFIG represents a list of branches separated by commas.
      # Due to limitations in environment variables, we represent the list as a single string.
      # Please ensure that branches are specified without spaces.
      BRANCH_REFS_CONFIG: "refs/heads/main,refs/heads/staging,refs/heads/integration,refs/heads/develop"

      PROD_BUCKET: ${self:custom.metadata-schema-publisher.prod-bucket-name}
      DEV_BUCKET: ${self:custom.metadata-schema-publisher.dev-bucket-name}

      MAIN_SCHEMA_URL: ${self:custom.metadata-schema-publisher.main-schema-url}
      DEV_SCHEMA_URL: ${self:custom.metadata-schema-publisher.dev-schema-url}

      UNVERSIONED_FILES_CONFIG: "property_migrations"
      JWT_AUDIENCE_TARGET_BRANCH_CONFIG: ${self:custom.metadata-schema-publisher.jwt-audience-target-branch}

      AWS_PROVIDER_REGION: ${self:provider.region}
      SECRET_NAME: ${self:custom.metadata-schema-publisher.secret-name}

      NOTIFY_ACTIONS: false
      SOLVE_ALLOF: true
    events:
      - http:
          path: github/push
          method: post

package:
  exclude:
    - node_modules/**
    - .venv/**